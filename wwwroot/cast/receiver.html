<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabyMonitarr</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: "Google Sans", Roboto, Arial, sans-serif;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #overlay {
            position: absolute;
            left: 24px;
            bottom: 20px;
            padding: 6px 14px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.55);
            font-size: 20px;
            transition: opacity 1s;
        }

        #overlay.faded {
            opacity: 0;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-align: center;
            pointer-events: none;
        }

        #status:empty {
            display: none;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div id="status">Starting…</div>
    <div id="overlay" class="faded"></div>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="../lib/microsoft-signalr/signalr.min.js"></script>
    <script src="../js/signalr-retry.js"></script>
    <script src="receiver.js"></script>
</body>
</html>
