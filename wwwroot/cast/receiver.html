<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BabyMonitarr</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: "Google Sans", Roboto, Arial, sans-serif;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #overlay {
            position: absolute;
            left: 24px;
            bottom: 20px;
            padding: 6px 14px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.55);
            font-size: 20px;
            transition: opacity 1s;
        }

        /* The room name sits above the sound graph rather than on its line. */
        body.sound-graph #overlay {
            bottom: calc(24% + 12px);
        }

        #overlay.faded {
            opacity: 0;
        }

        /* A scrim under the line: on a white night-vision picture it darkens just enough for the
           line to stand out, on a black one it is invisible. */
        #soundGraph {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 24%;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.2) 80%, rgba(0, 0, 0, 0));
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-align: center;
            pointer-events: none;
        }

        #status:empty {
            display: none;
        }

        /* Plays only the keepalive image (see receiver.js); the WebRTC video is what is shown. */
        cast-media-player {
            display: none;
        }
    </style>
</head>
<body>
    <cast-media-player></cast-media-player>
    <video id="video" autoplay playsinline></video>
    <canvas id="soundGraph" hidden></canvas>
    <div id="status">Starting…</div>
    <div id="overlay" class="faded"></div>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="../lib/microsoft-signalr/signalr.min.js"></script>
    <script src="../js/signalr-retry.js"></script>
    <script src="receiver.js"></script>
</body>
</html>
